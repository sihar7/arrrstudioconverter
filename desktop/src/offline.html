<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>ARRR Studio Converter</title>
    <style>
      :root {
        --bg: #f4f4f5; --surface: #ffffff; --fg: #17171a; --fg-2: #6c6c75; --line: #e4e4e7;
        --btn: #17171a; --btn-fg: #f4f4f5; --ease: cubic-bezier(.2, .8, .2, 1);
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0f0f11; --surface: #17171a; --fg: #f4f4f5; --fg-2: #a3a3ab; --line: #2c2c31; --btn: #f4f4f5; --btn-fg: #0f0f11; }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: 24px;
        background: var(--bg); color: var(--fg);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased; user-select: none;
      }
      main { width: min(420px, 100%); text-align: center; animation: rise .5s var(--ease) both; }
      img { width: 220px; height: auto; margin: 0 auto 28px; display: block; }
      @media (prefers-color-scheme: light) { img { filter: drop-shadow(0 6px 18px rgba(0,0,0,.18)); } }
      h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
      p { margin: 8px 0 28px; color: var(--fg-2); }
      button {
        height: 44px; padding: 0 22px; border: 0; border-radius: 999px; cursor: pointer;
        background: var(--btn); color: var(--btn-fg); font: inherit; font-weight: 600;
        transition: transform .12s var(--ease), opacity .12s;
      }
      button:hover { opacity: .88; }
      button:active { transform: scale(.96); }
      button:focus-visible { outline: 2px solid var(--fg-2); outline-offset: 3px; }
      button[aria-busy="true"] { opacity: .6; pointer-events: none; }
      small { display: block; margin-top: 18px; color: var(--fg-2); font-size: 12.5px; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
      @media (prefers-reduced-motion: reduce) { main { animation: none; } button { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/logo.png" alt="ARRR Studio Converter" />
      <h1>Tidak bisa terhubung</h1>
      <p>Periksa koneksi internet kamu, lalu coba lagi. Converter butuh internet untuk memproses audio.</p>
      <button id="retry" type="button" autofocus>Coba lagi</button>
      <small id="auto">Mencoba lagi otomatis saat online.</small>
    </main>
    <script>
      const target = new URLSearchParams(location.search).get("url");
      const btn = document.getElementById("retry");
      const go = () => {
        if (!target) return;
        btn.setAttribute("aria-busy", "true");
        btn.textContent = "Menghubungkan…";
        location.replace(target);
      };
      btn.addEventListener("click", go);
      addEventListener("online", go, { once: true });
    </script>
  </body>
</html>
