# Build app desktop (desktop/) untuk Windows & macOS lalu terbitkan ke GitHub Releases.
# Rilis: naikkan "version" di desktop/package.json → commit → push tag "desktop-v<versi>" (mis. desktop-v1.0.1).
# Halaman /download web memakai link releases/latest/download/<nama tetap> → otomatis versi terbaru.
# Opsional (tanda tangan kode): secret CSC_LINK + CSC_KEY_PASSWORD (Windows/macOS), APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID (notarize macOS).
name: Desktop Release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci

      - name: Build & publish (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & publish (macOS)
        if: runner.os == 'macOS'
        # Tanpa sertifikat Apple: tanda tangan ad-hoc ("-") supaya tetap bisa dibuka di Mac Apple Silicon
        run: |
          EXTRA=""
          if [ -z "$CSC_LINK" ]; then EXTRA="-c.mac.identity=-"; fi
          npx electron-builder --mac --publish always $EXTRA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
