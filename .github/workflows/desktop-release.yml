# Build app desktop (desktop/) untuk Windows & macOS lalu terbitkan ke GitHub Releases.
# Rilis: naikkan "version" di desktop/package.json → commit → push tag "desktop-v<versi>" (mis. desktop-v1.0.1),
# atau tab Actions → Desktop Release → Run workflow (memakai versi di package.json).
# Halaman /download web memakai link releases/latest/download/<nama tetap> → otomatis versi terbaru.
# Opsional (tanda tangan kode): secret CSC_LINK + CSC_KEY_PASSWORD (Windows/macOS).
#
# Build per OS TIDAK menerbitkan apa pun (--publish never); satu job "release" di akhir yang membuat rilis
# dengan semua file sekaligus. Dulu kedua OS publish bersamaan → bentrok di rilis yang sama → rilis setengah
# jadi (hanya .blockmap, tanpa installer).
name: Desktop Release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: Build (macOS)
        if: runner.os == 'macOS'
        # Tanpa sertifikat Apple: tanda tangan ad-hoc ("-") supaya tetap bisa dibuka di Mac Apple Silicon
        run: |
          EXTRA=""
          if [ -z "$CSC_LINK" ]; then EXTRA="-c.mac.identity=-"; fi
          npx electron-builder --mac --publish never $EXTRA
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      # Installer + latest*.yml + .blockmap (dibutuhkan auto-update electron-updater)
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tag rilis = v<versi> (konvensi electron-updater: tag harus semver)
      - id: ver
        run: echo "tag=v$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          fail_on_unmatched_files: true
          files: out/*
