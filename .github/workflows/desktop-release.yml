# Build app desktop (desktop/) untuk Windows & macOS lalu terbitkan ke GitHub Releases.
# OTOMATIS: setiap push ke main yang mengubah desktop/ → bila "version" di desktop/package.json belum pernah dirilis
# (tag v<versi> belum ada) langsung build + rilis; versi sama → dilewati (tidak ada rilis ganda).
# Jadi cukup naikkan "version" saat mengubah app desktop lalu push. Manual tetap bisa: push tag "desktop-v<versi>"
# atau tab Actions → Desktop Release → Run workflow.
# Halaman /download web memakai link releases/latest/download/<nama tetap> → otomatis versi terbaru.
# Opsional (tanda tangan kode): secret CSC_LINK + CSC_KEY_PASSWORD (Windows/macOS).
#
# Build per OS TIDAK menerbitkan apa pun (--publish never); satu job "release" di akhir yang membuat rilis
# dengan semua file sekaligus. Dulu kedua OS publish bersamaan → bentrok di rilis yang sama → rilis setengah
# jadi (hanya .blockmap, tanpa installer).
name: Desktop Release

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop-release.yml"]
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

# Push beruntun → hanya run terbaru yang jalan (run lama untuk versi yang sama dibatalkan)
concurrency:
  group: desktop-release
  cancel-in-progress: true

jobs:
  # Versi di package.json sudah punya rilis? → lewati build & rilis
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./desktop/package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag sudah dirilis — naikkan \"version\" di desktop/package.json untuk rilis baru"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: Build (macOS)
        if: runner.os == 'macOS'
        # Tanpa sertifikat Apple: tanda tangan ad-hoc ("-") supaya tetap bisa dibuka di Mac Apple Silicon.
        # CSC_LINK hanya di-export bila secret diisi — CSC_LINK="" dibaca electron-builder sebagai path file
        # (→ "desktop not a file").
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            npx electron-builder --mac --publish never
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder --mac --publish never -c.mac.identity=-
          fi
        env:
          MAC_CSC_LINK: ${{ secrets.CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      # Installer + latest*.yml + .blockmap (dibutuhkan auto-update electron-updater)
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tag rilis = v<versi> (konvensi electron-updater: tag harus semver)
      - id: ver
        run: echo "tag=v$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          fail_on_unmatched_files: true
          files: out/*
